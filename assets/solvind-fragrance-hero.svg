<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" role="img" aria-label="Cinematic still life of luxury fragrance bottles">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080d12"/><stop offset=".48" stop-color="#26343a"/><stop offset="1" stop-color="#090b10"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#c89a68" stop-opacity=".65"/><stop offset="1" stop-color="#c89a68" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#f2e4cb" stop-opacity=".9"/><stop offset=".28" stop-color="#9b7857" stop-opacity=".58"/><stop offset=".65" stop-color="#27313a" stop-opacity=".9"/><stop offset="1" stop-color="#090e14"/></linearGradient>
 <linearGradient id="amber" x2="0" y2="1"><stop stop-color="#e4b36e"/><stop offset="1" stop-color="#6c351e"/></linearGradient>
 <linearGradient id="smoke" x2="0" y2="1"><stop stop-color="#d9d3c8" stop-opacity=".65"/><stop offset="1" stop-color="#8d9897" stop-opacity=".08"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1800" height="1050" fill="url(#bg)"/>
<ellipse cx="900" cy="430" rx="650" ry="430" fill="url(#glow)" filter="url(#blur)"/>
<path d="M0 0h1800v1050H0z" fill="#071018" opacity=".2"/>
<g opacity=".32" fill="none" stroke="#c5b7a2"><path d="M100 0L0 480M390 0L90 640M1600 0l200 490M1400 0l250 620" stroke-width="2"/></g>
<path d="M0 790 Q450 740 900 790 T1800 770V1050H0Z" fill="#0a0d11"/>
<ellipse cx="900" cy="900" rx="740" ry="55" fill="#d5a879" opacity=".16" filter="url(#shadow)"/>
<!-- left dark bottle -->
<g transform="translate(255 310)">
 <ellipse cx="210" cy="570" rx="185" ry="32" fill="#000" opacity=".6" filter="url(#shadow)"/>
 <rect x="145" y="0" width="130" height="100" rx="8" fill="#11191c" stroke="#8f8069" stroke-width="3"/>
 <rect x="165" y="-50" width="90" height="58" rx="5" fill="#b7a27e"/>
 <rect x="55" y="90" width="310" height="470" rx="42" fill="url(#glass)" stroke="#d0b68e" stroke-opacity=".65" stroke-width="4"/>
 <path d="M80 130h35v390H80z" fill="#fff" opacity=".12"/>
 <rect x="90" y="270" width="240" height="150" fill="#11191b" opacity=".78"/>
 <text x="210" y="325" text-anchor="middle" fill="#e8ddca" font-family="Georgia,serif" font-size="31" letter-spacing="5">NOIR</text>
 <text x="210" y="365" text-anchor="middle" fill="#c6b79f" font-family="Arial,sans-serif" font-size="12" letter-spacing="4">EAU DE PARFUM</text>
</g>
<!-- central amber bottle -->
<g transform="translate(715 205)">
 <ellipse cx="210" cy="690" rx="205" ry="36" fill="#000" opacity=".7" filter="url(#shadow)"/>
 <rect x="155" y="0" width="110" height="110" rx="8" fill="#171b1b" stroke="#c3a16e" stroke-width="3"/>
 <rect x="175" y="-48" width="70" height="55" rx="4" fill="#c7a36e"/>
 <rect x="35" y="95" width="350" height="570" rx="56" fill="url(#amber)" stroke="#f1d3a2" stroke-opacity=".8" stroke-width="5"/>
 <path d="M65 145h45v470H65z" fill="#fff" opacity=".18"/>
 <path d="M350 150h18v460h-18z" fill="#30170d" opacity=".28"/>
 <rect x="75" y="325" width="270" height="170" fill="#151718" opacity=".88"/>
 <text x="210" y="392" text-anchor="middle" fill="#ead9bd" font-family="Georgia,serif" font-size="38" letter-spacing="7">AMBRE</text>
 <text x="210" y="435" text-anchor="middle" fill="#d6c4a5" font-family="Arial,sans-serif" font-size="13" letter-spacing="5">EXTRAIT DE PARFUM</text>
 <text x="210" y="466" text-anchor="middle" fill="#d6c4a5" font-family="Arial,sans-serif" font-size="10" letter-spacing="3">50 ML</text>
</g>
<!-- right clear bottle -->
<g transform="translate(1210 365)">
 <ellipse cx="170" cy="500" rx="170" ry="30" fill="#000" opacity=".65" filter="url(#shadow)"/>
 <rect x="130" y="0" width="80" height="90" rx="5" fill="#b9b2a4"/>
 <rect x="145" y="-42" width="50" height="48" rx="4" fill="#242a2b"/>
 <rect x="30" y="80" width="280" height="410" rx="42" fill="#c7d0ca" fill-opacity=".3" stroke="#e4dfd2" stroke-opacity=".8" stroke-width="5"/>
 <path d="M55 120h38v330H55z" fill="#fff" opacity=".24"/>
 <rect x="55" y="250" width="230" height="120" fill="#e8e0d1" opacity=".9"/>
 <text x="170" y="300" text-anchor="middle" fill="#273035" font-family="Georgia,serif" font-size="28" letter-spacing="5">SŌL</text>
 <text x="170" y="332" text-anchor="middle" fill="#48504f" font-family="Arial,sans-serif" font-size="11" letter-spacing="4">BOTANICAL SCENT</text>
</g>
<!-- foreground small flacon -->
<g transform="translate(570 650) scale(.62)">
 <rect x="145" y="0" width="110" height="80" rx="5" fill="#25292b"/>
 <rect x="55" y="65" width="290" height="300" rx="35" fill="#4e5d57" stroke="#c6b99e" stroke-width="5"/>
 <rect x="85" y="170" width="230" height="95" fill="#d7c7a9"/>
 <text x="200" y="225" text-anchor="middle" fill="#27302d" font-family="Georgia,serif" font-size="27" letter-spacing="5">CEDRE</text>
</g>
<g fill="none" stroke="#d4b58b" opacity=".28"><path d="M0 830 Q450 760 900 830T1800 815" stroke-width="2"/><path d="M0 850 Q450 780 900 850T1800 835"/></g>
<text x="900" y="100" text-anchor="middle" fill="#f1e8da" opacity=".8" font-family="Arial,sans-serif" font-size="18" letter-spacing="12">THE ART OF SCENT</text>
</svg>